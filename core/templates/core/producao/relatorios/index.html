{% extends 'core/layout.html' %}

{% block title %}Produção - Relatórios{% endblock %}

{% block breadcrumb %}
    <span style="font-size: 1rem; font-weight: normal;">
        <span class="text-primary">Produção</span> /
        <span class="text-primary">Relatórios</span>
    </span>
{% endblock %}

{% block content %}
<div class="container-fluid pt-3">
    <div class="row mb-4">
        <div class="col-12">
            <h4 class="text-secondary border-bottom pb-2"><i class="fas fa-chart-pie"></i> Relatórios</h4>
        </div>
    </div>

    <div class="row">
        <!-- alex relatorio oculto: card "Vendas" desligado por enquanto.
             Para voltar a mostrar, procure por "alex relatorio oculto" neste
             arquivo e apague as duas linhas com "comment"/"endcomment" abaixo. -->
        {% comment %}
        <div class="col-lg-3 col-6">
            <a href="{% url 'producao_relatorios_vendas' %}" class="link-card">
                <div class="card card-menu mb-4">
                    <div class="card-body text-center p-4">
                        <i class="fas fa-chart-line fa-3x mb-3"></i>
                        <h5 class="card-title text-dark fw-bold">Vendas</h5>
                        <p class="card-text text-muted small">Dashboard de indicações e ligações</p>
                    </div>
                </div>
            </a>
        </div>
        {% endcomment %}
    </div>
</div>
{% endblock %}
